name: Auto Restart sellerflow-live-server every 3 hours

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Restart Render service
        run: |
          echo "Triggering restart at $(date -u)..."
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/restart" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json")
          echo "HTTP status: $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Restart triggered successfully."
          else
            echo "Restart FAILED with status $HTTP_CODE"
            exit 1
          fi
