<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SellerFlowLive Grabber</title>
  <style>
    body{width:330px;margin:0;font-family:Arial,sans-serif;background:#10051f;color:#fff}
    main{padding:16px}
    h1{font-size:18px;margin:0 0 6px}
    p{font-size:12px;line-height:1.4;color:#d8cafe;margin:0 0 14px}
    label{display:block;font-size:12px;font-weight:700;color:#c4b5fd;margin:10px 0 5px}
    input{width:100%;box-sizing:border-box;border:1px solid #7c3aed;border-radius:10px;background:#160c2f;color:#fff;padding:10px;font-size:13px}
    button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:11px;background:linear-gradient(135deg,#a855f7,#22d3ee);color:#fff;font-weight:800;cursor:pointer}
    .status{margin-top:12px;padding:10px;border-radius:10px;background:#20123f;color:#c4b5fd;font-size:12px}
    .hint{margin-top:10px;color:#a7f3d0}
  </style>
</head>
<body>
  <main>
    <h1>SellerFlowLive Grabber</h1>
    <p>For testing: save seller email once, then open any TikTok LIVE. The extension detects the LIVE account automatically.</p>

    <label>Seller login email</label>
    <input id="sellerId" placeholder="seller@email.com">

    <label>Live server URL</label>
    <input id="serverUrl" placeholder="https://sellerflow-live-server.onrender.com">

    <button id="save">Save settings</button>
    <div class="status" id="status">Not saved yet</div>
    <p class="hint">Keep this extension enabled while selling live.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
