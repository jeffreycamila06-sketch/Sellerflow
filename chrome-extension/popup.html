<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        color: #26215c;
        font-family: Arial, Helvetica, sans-serif;
      }

      h3 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #ece9ff;
        color: #4025bd;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
        padding: 8px 10px;
      }

      button.primary {
        background: #20c576;
        color: #fff;
      }

      .meta {
        color: #6b6788;
        font-size: 11px;
        margin-bottom: 8px;
      }

      ul {
        max-height: 280px;
        overflow-y: auto;
        padding: 0;
        margin: 0;
        list-style: none;
      }

      li {
        border-top: 1px solid #eeeafd;
        padding: 8px 0;
      }

      .name {
        font-size: 12px;
        font-weight: 900;
      }

      .comment {
        color: #111;
        font-size: 12px;
        margin-top: 3px;
        word-break: break-word;
      }

      .time {
        color: #777;
        font-size: 10px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h3>SellerFlow Live Comment</h3>
    <div class="actions">
      <button id="downloadCsv" class="primary">Download CSV</button>
      <button id="clearHistory">Clear</button>
    </div>
    <div id="meta" class="meta">Loading comments...</div>
    <ul id="commentList"></ul>
    <script src="popup.js"></script>
  </body>
</html>
