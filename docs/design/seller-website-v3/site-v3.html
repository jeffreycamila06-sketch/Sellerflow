<title>Seller Website v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{--bg:#eef0f4;--fg:#14161c;--mut:#5b6170;--card:#fff;--line:#d9dde6;--acc:#5b3df5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1116;--fg:#eef0f5;--mut:#9aa1b2;--card:#1a1d25;--line:#2b303c;--acc:#9d8bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1116;--fg:#eef0f5;--mut:#9aa1b2;--card:#1a1d25;--line:#2b303c;--acc:#9d8bff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;min-height:100dvh}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mut);font:600 12.5px Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.seg span{font:600 11px Inter;color:var(--mut);align-self:center;padding:0 6px 0 10px;text-transform:uppercase;letter-spacing:.06em}
.stage{display:flex;justify-content:center;padding:4px 0 24px}
.dev{background:#111;border-radius:44px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
.dev.android{border-radius:30px}
.dev.laptop{border-radius:14px;padding:8px 8px 14px}
.dev .cam{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#111;z-index:60;border-radius:20px}
.dev.iphone .cam{width:96px;height:26px}
.dev.android .cam{width:12px;height:12px;top:20px}
.dev.laptop .cam{display:none}
.dev.bare{background:transparent;padding:0;border-radius:0;box-shadow:none}
.dev.bare .cam{display:none}
.dev.bare .vp{border-radius:0}

/* ---------- SHOP (inside the frame) ---------- */
.vp{container:vp/inline-size;display:flex;flex-direction:column;overflow:hidden;border-radius:34px;position:relative;background:var(--s-bg);color:var(--s-fg);font-family:var(--s-font);font-size:14px;line-height:1.4}
.android .vp{border-radius:20px}.laptop .vp{border-radius:6px}
.t-pop{--s-bg:#f5f5f7;--s-fg:#17181c;--s-mut:#6c7080;--s-card:#fff;--s-line:#e8e9ee;--s-acc:#ee4d2d;--s-acc2:#fff3ef;--s-on:#fff;--s-ok:#16a34a;--s-font:"Plus Jakarta Sans",system-ui,sans-serif;--s-head:"Plus Jakarta Sans",system-ui,sans-serif;--s-r:14px;--s-hero:linear-gradient(120deg,#ff7a45,#ee4d2d 55%,#c81e4a)}
.t-bou{--s-bg:#faf6f0;--s-fg:#2a2420;--s-mut:#7d7268;--s-card:#fffdf9;--s-line:#e9e0d3;--s-acc:#2f4a3a;--s-acc2:#edf2ec;--s-on:#fff;--s-ok:#2f7a4d;--s-font:Inter,system-ui,sans-serif;--s-head:Fraunces,Georgia,serif;--s-r:6px;--s-hero:linear-gradient(120deg,#d9c7ae,#c8a98a 60%,#a98567)}
.t-bold{--s-bg:#0e0f12;--s-fg:#f3f4f6;--s-mut:#9a9eaa;--s-card:#191b21;--s-line:#2a2d36;--s-acc:#d7ff3e;--s-acc2:#23261a;--s-on:#0e0f12;--s-ok:#5fe08a;--s-font:Inter,system-ui,sans-serif;--s-head:"Space Grotesk",system-ui,sans-serif;--s-r:4px;--s-hero:linear-gradient(120deg,#22252e,#3a2a6b 60%,#6b2a5a)}
.vp button{font-family:inherit;cursor:pointer}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
h2,h3,.hd{font-family:var(--s-head);letter-spacing:-.01em;margin:0}
.ann{background:var(--s-fg);color:var(--s-bg);text-align:center;font-size:12px;font-weight:600;padding:7px 12px}
.dev.iphone:not(.bare) .vp::before,.dev.android:not(.bare) .vp::before{content:"";flex:none;height:38px;background:var(--s-fg)}.dev.android:not(.bare) .vp::before{height:32px}
.hdr{position:sticky;top:0;z-index:30;background:var(--s-card);border-bottom:1px solid var(--s-line)}
.hdr .row{display:flex;align-items:center;gap:10px;padding:9px 0}
.logo{display:flex;align-items:center;gap:8px;font:700 17px var(--s-head);border:0;background:none;color:inherit;padding:0}
.logo i{width:30px;height:30px;border-radius:50%;background:var(--s-acc);color:var(--s-on);display:grid;place-items:center;font:800 15px var(--s-head);font-style:normal}
.srch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--s-bg);border:1px solid var(--s-line);border-radius:999px;padding:8px 12px;color:var(--s-mut);font-size:13px}
.srch input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit;color:var(--s-fg)}
.ib{position:relative;border:0;background:none;color:inherit;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:22px;height:22px}
.ib b{position:absolute;top:0;right:0;background:var(--s-acc);color:var(--s-on);font:700 10px Inter;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.nav{display:none;gap:22px;padding:0 0 10px;font-weight:600;font-size:13.5px}
.nav button{border:0;background:none;color:var(--s-mut);padding:0;font:inherit}.nav button:hover{color:var(--s-acc)}
.lname{display:none}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--s-r);margin-top:10px}
.hero::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;min-height:176px;padding:20px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;position:relative;overflow:hidden}
.slide h2{font-size:25px;line-height:1.08;max-width:11em}
.slide p{margin:6px 0 12px;font-size:13px;opacity:.92;max-width:22em}
.slide .art{width:120px;height:120px;flex:none;background:transparent!important;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.btn{border:0;border-radius:999px;background:var(--s-acc);color:var(--s-on);font-weight:700;font-size:13.5px;padding:11px 18px}
.sharp .btn{border-radius:var(--s-r)}
.btn.w{background:#fff;color:#17181c}.btn.o{background:transparent;color:var(--s-fg);border:1.5px solid var(--s-fg)}.btn.full{width:100%;padding:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0 0}.dots i{width:6px;height:6px;border-radius:3px;background:var(--s-line)}.dots i.on{width:16px;background:var(--s-acc)}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.trust div{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:9px 10px;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600}
.trust small{display:block;font-weight:400;color:var(--s-mut);font-size:11px}
.trust svg{width:20px;height:20px;color:var(--s-acc);flex:none}
.sec{margin-top:22px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h3{font-size:19px}.sech button{border:0;background:none;color:var(--s-acc);font-weight:700;font-size:13px;padding:0}
.caps .sech h3,.caps .band h2{text-transform:uppercase}
.cats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:68px;border:0;background:none;color:inherit;padding:0;text-align:center;font-size:11.5px;font-weight:600}
.cat .art{width:68px;height:68px;border-radius:50%;margin-bottom:5px;border:2px solid var(--s-card);box-shadow:0 0 0 1px var(--s-line)}
.sharp .cat .art{border-radius:var(--s-r)}
.live{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.live .pill{background:#e11d48;color:#fff;font:700 11px Inter;padding:3px 8px;border-radius:4px;letter-spacing:.05em}
.live .tx{flex:1;min-width:150px}.live .tx b{font:700 15.5px var(--s-head);display:block;margin-top:3px}
.live .tx span{color:var(--s-mut);font-size:12.5px}
.flash{background:var(--s-acc2);border-radius:var(--s-r);padding:12px}
.cd{display:inline-flex;gap:3px;align-items:center;font:700 12px Inter}.cd i{background:var(--s-fg);color:var(--s-bg);border-radius:4px;padding:2px 5px;font-style:normal}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.hs::-webkit-scrollbar{display:none}
.hs .card{flex:0 0 142px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);overflow:hidden;position:relative;display:flex;flex-direction:column;cursor:pointer}
.card .ph{position:relative;aspect-ratio:1/1.12;overflow:hidden}
.card .imgs{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.card .imgs::-webkit-scrollbar{display:none}
.card .imgs .art{flex:0 0 100%;height:100%;scroll-snap-align:start}
.art{display:block;width:100%;height:100%}
.bdg{position:absolute;top:7px;left:7px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;z-index:2}
.bdg span{font:700 10.5px Inter;padding:3px 7px;border-radius:4px;background:var(--s-acc);color:var(--s-on)}
.bdg .n{background:var(--s-fg);color:var(--s-bg)}.bdg .l{background:#f59e0b;color:#1c1300}.bdg .x{background:#6b7280;color:#fff}
.rank{position:absolute;top:0;left:8px;background:#f59e0b;color:#1c1300;font:800 12px Inter;padding:4px 7px 6px;border-radius:0 0 6px 6px;z-index:2}
.hrt{position:absolute;top:6px;right:6px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#17181c;display:grid;place-items:center}
.hrt svg{width:16px;height:16px}.hrt.on{color:#e11d48}.hrt.on svg{fill:#e11d48}
.pd3{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:2}.pd3 i{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,.25)}.pd3 i:first-child{background:rgba(0,0,0,.6)}
.card .inf{padding:8px 9px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.sw{display:flex;gap:4px;align-items:center;min-height:14px}.sw i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}.sw small{font-size:10.5px;color:var(--s-mut)}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.pr b{color:var(--s-acc);font:800 15.5px var(--s-head)}.pr s{color:var(--s-mut);font-size:11.5px}

.meta{display:flex;justify-content:space-between;align-items:center;color:var(--s-mut);font-size:11px;margin-top:auto}
.qa{width:30px;height:30px;border-radius:50%;border:0;background:var(--s-acc);color:var(--s-on);font:700 18px Inter;line-height:1;display:grid;place-items:center}
.sharp .qa{border-radius:var(--s-r)}
.sold .art{filter:grayscale(1) opacity(.55)}
.promo{border-radius:var(--s-r);background:var(--s-fg);color:var(--s-bg);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.promo h3{font-size:20px}.promo p{margin:4px 0 0;opacity:.8;font-size:13px}
.vch{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.vch::-webkit-scrollbar{display:none}
.vc{flex:0 0 232px;display:flex;border:1.5px dashed var(--s-acc);border-radius:var(--s-r);background:var(--s-acc2);overflow:hidden}
.vc div{flex:1;padding:10px 12px}.vc b{font:800 17px var(--s-head);color:var(--s-acc);display:block}.vc small{color:var(--s-mut);font-size:11.5px}

.vc button{border:0;background:var(--s-acc);color:var(--s-on);font-weight:700;font-size:12px;padding:0 12px}
.rev{display:grid;gap:10px}
.rv{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:12px}
.stars{color:#f59e0b;letter-spacing:1px;font-size:13px}.rv p{margin:6px 0;font-size:13px}.rv small{color:var(--s-mut);font-size:11.5px}
.about{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:16px}
.about p{color:var(--s-mut);margin:8px 0 12px;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{font:800 18px var(--s-head);display:block}.stats span{font-size:11px;color:var(--s-mut)}
.steps{display:grid;gap:8px}.step{display:flex;gap:10px;align-items:flex-start;background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:12px}
.step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--s-acc);color:var(--s-on);font:800 13px Inter;display:grid;place-items:center;font-style:normal}
.step b{display:block;font-size:13.5px}.step span{color:var(--s-mut);font-size:12.5px}
details{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:12px 14px;margin-bottom:8px}
summary{font-weight:700;font-size:13.5px;cursor:pointer}details p{margin:8px 0 0;color:var(--s-mut);font-size:13px}
.foot{margin-top:26px;background:var(--s-card);border-top:1px solid var(--s-line);padding:20px 0 26px;font-size:12.5px;color:var(--s-mut)}
.fcols{display:grid;gap:16px}.foot b{color:var(--s-fg);display:block;margin-bottom:6px;font-size:13px}
.soc{display:flex;gap:8px;flex-wrap:wrap}.soc span{width:34px;height:34px;border-radius:50%;background:var(--s-bg);border:1px solid var(--s-line);display:grid;place-items:center;font:700 11px Inter;color:var(--s-fg)}
.pay{display:flex;gap:6px;flex-wrap:wrap}.pay span{border:1px solid var(--s-line);border-radius:5px;padding:4px 8px;font:700 11px Inter;color:var(--s-fg);background:var(--s-bg)}
.pw{text-align:center;margin-top:16px;font-size:11.5px}
.bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s-card);border-top:1px solid var(--s-line);padding:6px 0 10px;flex:none}
.bnav button{border:0;background:none;color:var(--s-mut);font:600 10.5px var(--s-font);display:grid;justify-items:center;gap:2px;position:relative}
.bnav svg{width:21px;height:21px}.bnav .on{color:var(--s-acc)}.bnav b{position:absolute;top:-3px;left:54%;background:var(--s-acc);color:var(--s-on);font:700 9.5px Inter;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}
.buy{display:flex;gap:8px;background:var(--s-card);border-top:1px solid var(--s-line);padding:8px 12px 12px;flex:none;align-items:center}
.buy .btn{flex:1;padding:13px 8px}.buy .tot{flex:1;font-size:12px;color:var(--s-mut)}.buy .tot b{display:block;color:var(--s-fg);font:800 17px var(--s-head)}
.fab{position:absolute;right:14px;bottom:74px;z-index:25;width:50px;height:50px;border-radius:50%;border:0;background:#06c755;color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.fab svg{width:25px;height:25px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--s-line);background:var(--s-card);color:var(--s-fg);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--s-fg);color:var(--s-bg);border-color:var(--s-fg)}
.tool{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--s-mut);font-size:12.5px;margin-bottom:10px}
.tool select{border:1px solid var(--s-line);background:var(--s-card);color:var(--s-fg);border-radius:8px;padding:7px 8px;font:600 12.5px var(--s-font)}
.crumb{font-size:12px;color:var(--s-mut);padding:10px 0}.crumb button{border:0;background:none;color:inherit;padding:0;font:inherit;text-decoration:underline}
.pdp{display:grid;gap:14px}
.gal{position:relative;border-radius:var(--s-r);overflow:hidden;background:var(--s-card)}
.gal .imgs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1}.gal .imgs::-webkit-scrollbar{display:none}
.gal .imgs .art{flex:0 0 100%;scroll-snap-align:start}
.gal .cnt{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font:600 11px Inter;padding:3px 8px;border-radius:10px}
.ths{display:flex;gap:8px;margin-top:8px}.ths button{width:58px;height:58px;border-radius:var(--s-r);overflow:hidden;border:2px solid var(--s-line);padding:0;background:none}.ths button.on{border-color:var(--s-acc)}
.pi h2{font-size:21px;line-height:1.2}.pi .pr b{font-size:25px}.pi .pr s{font-size:14px}
.off{background:var(--s-acc);color:var(--s-on);font:700 11px Inter;padding:2px 6px;border-radius:4px}
.sub{color:var(--s-mut);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.box{background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:13px}
.lbl{font-weight:700;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}.lbl button{border:0;background:none;color:var(--s-acc);font:600 12px var(--s-font);padding:0;text-decoration:underline}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-width:46px;border:1.5px solid var(--s-line);background:var(--s-card);color:var(--s-fg);border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.sharp .opt{border-radius:var(--s-r)}
.opt.on{border-color:var(--s-acc);box-shadow:0 0 0 1px var(--s-acc)}.opt:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.opt i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--s-line);border-radius:8px;overflow:hidden}.qty button{border:0;background:var(--s-card);color:var(--s-fg);width:36px;height:36px;font-size:18px}.qty span{min-width:34px;text-align:center;font-weight:700}
.rows{display:grid;gap:9px;font-size:13px}.rows div{display:flex;gap:10px}.rows svg{width:18px;height:18px;flex:none;color:var(--s-acc);margin-top:1px}.rows small{display:block;color:var(--s-mut);font-size:12px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.spec span{color:var(--s-mut)}
.ci{display:flex;gap:10px;background:var(--s-card);border:1px solid var(--s-line);border-radius:var(--s-r);padding:10px;margin-bottom:8px}
.ci .art{width:74px;height:74px;border-radius:8px;flex:none}.ci .m{flex:1;min-width:0}.ci .m b{display:block;font-size:13.5px}.ci .m small{color:var(--s-mut)}
.ci .x{border:0;background:none;color:var(--s-mut);font-size:12px;text-decoration:underline;padding:0}
.prog{height:6px;background:var(--s-line);border-radius:3px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--s-ok)}
.sum{display:grid;gap:7px;font-size:13.5px}.sum div{display:flex;justify-content:space-between}.sum .t{font:800 17px var(--s-head);border-top:1px solid var(--s-line);padding-top:9px;margin-top:2px}
.sum .g{color:var(--s-ok)}
.fld{display:grid;gap:5px;margin-bottom:10px;font-size:12.5px;font-weight:600}
.fld input,.fld textarea{border:1.5px solid var(--s-line);background:var(--s-bg);color:var(--s-fg);border-radius:8px;padding:11px 12px;font:400 16px var(--s-font);width:100%}

 <div class="side"><div class="box"><div class="lbl">Summary</div><div class="sum"><div><span>Items</span><b>${fmt(o.s)}</b></div><div><span>Shipping</span><b>${o.shipF?fmt(o.shipF):"Free"}</b></div>${o.disc?`<div class="g"><span>Voucher</span><b>−${fmt(o.disc)}</b></div>`:""}<div class="t"><span>Total</span><span>${fmt(o.t)}</span></div></div><p style="font-size:12.5px;color:var(--s-mut);margin:10px 0 0">${SHIP[o.ship].n}${o.store?" · "+o.store:""}<br>${PAY[o.pay].n}</p></div></div></div></div>`}
function wishV(){const a=P.filter(p=>S.wish.has(p.id));return header()+`<div class="wrap"><h2 style="font-size:22px;margin:14px 0 10px">Saved items</h2>${a.length?`<div class="grid">${a.map(p=>card(p)).join("")}</div>`:`<div class="empty">Tap ♡ on anything you like to save it here.</div>`}</div>`}
const VIEWS={home,list,pdp,cart:cartV,checkout,track:orderV,wish:wishV};
function bottom(){if(S.view=="pdp"){const p=P.find(x=>x.id==S.pid),st=stock(p);return `<div class="buy"><button class="ib" data-act="sheet" data-s="chat" aria-label="Chat">${ic("chat")}</button><button class="btn o" data-act="add" ${st?"":"disabled"}>Add to cart</button><button class="btn" data-act="buy" ${st?"":"disabled"}>${st?"Buy now":"Sold out"}</button></div>`}
 if(S.view=="cart"&&S.cart.length)return `<div class="buy"><div class="tot">Total<b>${fmt(totals().t)}</b></div><button class="btn" data-act="go" data-v="checkout">Checkout (${count()})</button></div>`;
 if(S.view=="checkout")return `<div class="buy"><div class="tot">Total<b>${fmt(totals().t)}</b></div><button class="btn" data-act="place">Place order</button></div>`;
 const n=(v,i,l,b)=>`<button class="${S.view==v?"on":""}" data-act="go" data-v="${v}">${ic(i)}${b?`<b>${b}</b>`:""}${l}</button>`;
 return `<div class="bnav">${n("home","home","Home")}${n("list","grid","Shop")}${n("cart","cart","Cart",count())}${n("track","box","Orders")}<button data-act="sheet" data-s="chat">${ic("chat")}Chat</button></div>`}
function sheet(){const s=S.sheet;if(!s)return "";let h="";
 if(s=="chat")h=`<h3>Chat with Budgetukay</h3><p style="color:var(--s-mut);font-size:13px;margin:0 0 12px">Usually replies in a few minutes · 10AM–11PM</p>${[["LINE","#06c755"],["Messenger","#0084ff"],["WhatsApp","#25d366"],["Instagram","#d6249f"]].map(c=>`<button class="cb" data-act="toast" data-m="Opens ${c[0]} with this shop"><i style="background:${c[1]}">${c[0][0]}</i>${c[0]}</button>`).join("")}`;
 if(s=="size")h=`<h3>Size guide</h3><table><tr><th>Size</th><th>Chest</th><th>Length</th><th>Fits</th></tr><tr><td>M</td><td>52 cm</td><td>68 cm</td><td>155–165 cm</td></tr><tr><td>L</td><td>56 cm</td><td>70 cm</td><td>165–175 cm</td></tr><tr><td>XL</td><td>60 cm</td><td>73 cm</td><td>175–185 cm</td></tr></table><p style="color:var(--s-mut);font-size:12.5px">Measured flat, side to side. Not sure? Chat us your height and weight.</p>`;
 if(s=="ret")h=`<h3>Returns & exchange</h3><p style="font-size:13.5px;color:var(--s-mut)">Within 7 days of pickup, if the item is not as described. Send a photo in chat. We refund or exchange. Shipping back is on us when it's our mistake.</p>`;
 if(s=="store")h=`<h3>Choose your ${SHIP[S.ship].n.replace(" pickup","")} store</h3><label class="fld"><input placeholder="Search store name or number"></label>${["板橋門市 · 新北市板橋區文化路一段 100 號","府中門市 · 新北市板橋區府中路 29 號","新埔門市 · 新北市板橋區民生路二段 226 號"].map(x=>`<button class="radio" data-act="store" data-n="${x.split(" · ")[0]}"><span><b>${x.split(" · ")[0]}</b><small>${x.split(" · ")[1]}</small></span></button>`).join("")}`;
 return `<div class="sheet" data-act="close"><div data-stop>${h}<button class="btn o full" data-act="close" style="margin-top:6px">Close</button></div></div>`}
let hist=[];
function render(keep){const sc=$("#scr"),top=sc.scrollTop;sc.innerHTML=VIEWS[S.view]();$("#bottom").innerHTML=bottom();
 $("#over").innerHTML=sheet()+(["home","list","track","wish"].includes(S.view)?`<button class="fab" data-act="sheet" data-s="chat" aria-label="Chat with shop">${ic("chat")}</button>`:"");
 sc.scrollTop=keep?top:0;const so=$("#sort");if(so)so.value=S.sort;
 const h=$("#hero");if(h)h.onscroll=()=>{const i=Math.round(h.scrollLeft/h.clientWidth);[...$("#hdots").children].forEach((d,k)=>d.classList.toggle("on",k==i))};
 const g=$("#gal");if(g)g.onscroll=()=>{const i=Math.round(g.scrollLeft/g.clientWidth);$("#galn").textContent=(i+1)+" / 3";document.querySelectorAll(".ths button").forEach((b,k)=>b.classList.toggle("on",k==i))}}
function go(v,keep){if(v!=S.view)hist.push(S.view);S.view=v;S.sheet=null;render(keep)}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#over").appendChild(t);setTimeout(()=>t.remove(),1900)}
function addCart(p,col,size,q){const st=p.sizes[size];const e=S.cart.find(c=>c.id==p.id&&c.col==col&&c.size==size);const have=e?e.q:0;if(have+q>st){toast("Only "+st+" in stock");return false}e?e.q+=q:S.cart.push({id:p.id,col,size,q});return true}
$("#vp").addEventListener("click",e=>{const stop=e.target.closest("[data-stop]"),el=e.target.closest("[data-act]");if(!el||(stop&&el.dataset.act=="close"&&!e.target.closest("button")))return;const d=el.dataset,p=P.find(x=>x.id==(d.id||S.pid));
 switch(d.act){
 case "go":go(d.v);break;case "back":S.view=hist.pop()||"home";S.sheet=null;render();break;
 case "open":S.pid=+d.id;S.sel={col:0,size:null,q:1,img:0};go("pdp");if(S.view=="pdp")render();break;
 case "wish":e.stopPropagation();S.wish.has(p.id)?S.wish.delete(p.id):S.wish.add(p.id);render(true);toast(S.wish.has(p.id)?"Saved ♥":"Removed");break;
 case "quick":{e.stopPropagation();const sz=Object.entries(p.sizes).filter(x=>x[1]>0);if(sz.length>1||p.cols.length>1){S.pid=p.id;S.sel={col:0,size:null,q:1,img:0};go("pdp");toast("Pick your size")}else if(addCart(p,0,sz[0][0],1)){render(true);toast("Added to cart ✓")}break}
 case "cat":S.cat=d.c;S.q="";go("list");render();break;case "size":S.size=d.s;render(true);break;case "stock":S.stock=!S.stock;render(true);break;
 case "reset":S.cat="all";S.size="all";S.stock=false;S.q="";render();break;case "sortgo":S.sort=d.s;S.cat="all";go("list");break;
 case "col":S.sel.col=+d.i;render(true);break;case "sz":S.sel.size=d.s;S.sel.q=1;render(true);break;
 case "q":{const mx=S.sel.size?p.sizes[S.sel.size]:1;S.sel.q=Math.max(1,Math.min(mx,S.sel.q+ +d.d));render(true);break}
 case "img":$("#gal").scrollTo({left:$("#gal").clientWidth*d.i,behavior:"smooth"});break;
 case "add":case "buy":if(!S.sel.size){toast("Please choose a size");break}if(addCart(p,S.sel.col,S.sel.size,S.sel.q)){if(d.act=="buy")go("checkout");else{render(true);toast("Added to cart ✓")}}break;
 case "cq":{const c=S.cart[d.i],pp=P.find(x=>x.id==c.id);c.q=Math.max(1,Math.min(pp.sizes[c.size],c.q+ +d.d));render(true);break}
 case "rm":S.cart.splice(d.i,1);render(true);break;
 case "claim":S.vc=d.c;toast("Voucher "+d.c+" saved — used at checkout");break;
 case "vc":{const v=$("#vc").value.trim().toUpperCase();if(["UKAY50","HELLO10"].includes(v)){S.vc=v;render(true);toast("Voucher applied ✓")}else toast("That code doesn't work")}break;
 case "ship":S.ship=d.k;S.store=null;render(true);break;case "pay":S.pay=d.k;render(true);break;
 case "store":S.store=d.n;S.sheet=null;render(true);break;
 case "place":if(!S.cart.length)break;if(S.ship!="home"&&!S.store){toast("Choose your pickup store");S.sheet="store";render(true);break}
  S.order={no:"W-1042",...totals(),ship:S.ship,pay:S.pay,store:S.store};S.receipt=false;S.cart=[];hist=[];go("track");break;
 case "receipt":S.receipt=true;render(true);toast("Receipt uploaded ✓");break;
 case "sheet":S.sheet=d.s;render(true);break;case "close":S.sheet=null;render(true);break;
 case "toast":toast(d.m);break}});
$("#vp").addEventListener("change",e=>{if(e.target.id=="sort"){S.sort=e.target.value;render(true)}});
$("#vp").addEventListener("keydown",e=>{if(e.target.id=="q"&&e.key=="Enter"){S.q=e.target.value;S.cat="all";go("list");render()}});
let T=2*3600+14*60+9;setInterval(()=>{T=Math.max(0,T-1);const h=String(Math.floor(T/3600)).padStart(2,"0"),m=String(Math.floor(T%3600/60)).padStart(2,"0"),s=String(T%60).padStart(2,"0");document.querySelectorAll("[data-cd]").forEach(el=>{const i=el.querySelectorAll("i");if(i.length==3&&!el.textContent.includes("Auto")){i[0].textContent=h;i[1].textContent=m;i[2].textContent=s}else if(i.length==3)i[2].textContent=s})},1000);
/* device + theme */
const DEV={iphone:[390,800],android:[412,820],laptop:[1280,780]};let dev="iphone";
function fit(){const d=$("#dev"),vp=$("#vp"),sc=$("#scaler"),W=document.documentElement.clientWidth,H=window.innerHeight,bar=$(".bar").offsetHeight;
 d.className="dev "+dev;let [w,h]=DEV[dev];sc.style.cssText="";d.style.cssText="";
 if(dev!="laptop"&&W<520){d.classList.add("bare");w=W;h=Math.max(480,H-bar-8)}
 vp.style.width=w+"px";vp.style.height=h+"px";
 const ow=d.offsetWidth,oh=d.offsetHeight,k=Math.min(1,(W-(dev=="laptop"&&W<520?8:24))/ow);
 if(k<1){d.style.transform=`scale(${k})`;d.style.transformOrigin="top left";sc.style.width=ow*k+"px";sc.style.height=oh*k+"px"}}
$("#segDev").onclick=e=>{const b=e.target.closest("button");if(!b)return;dev=b.dataset.d;[...$("#segDev").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x==b));fit();render(true)};
$("#segTh").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#vp").className="vp "+b.dataset.t;[...$("#segTh").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x==b))};
addEventListener("resize",fit);fit();render();
</script>

<script>
/* ===== v3: two layouts + what the seller can set ===== */
const CFG={layout:"brand",top1:"#1f4fa8",top2:"#8b5cf6",btn:"#111111",sale:"#dc2626",dark:0,font:"grotesk",sharp:1};
const PRESETS=[["Ocean",{top1:"#1f4fa8",top2:"#8b5cf6",btn:"#111111",sale:"#dc2626",dark:0,font:"grotesk",sharp:1}],["Midnight",{top1:"#0b0b0f",top2:"#4c1d95",btn:"#d7ff3e",sale:"#fb7185",dark:1,font:"grotesk",sharp:1}],["Blush",{top1:"#f472b6",top2:"#fb923c",btn:"#be185d",sale:"#e11d48",dark:0,font:"jakarta",sharp:0}],["Forest",{top1:"#2f4a3a",top2:"#84a98c",btn:"#2f4a3a",sale:"#b45309",dark:0,font:"serif",sharp:1}],["Sunset",{top1:"#ff7a45",top2:"#c81e4a",btn:"#ee4d2d",sale:"#ee4d2d",dark:0,font:"jakarta",sharp:0}]];
const FONTS={grotesk:['"Space Grotesk",system-ui,sans-serif','Inter,system-ui,sans-serif',1],jakarta:['"Plus Jakarta Sans",system-ui,sans-serif','"Plus Jakarta Sans",system-ui,sans-serif',0],serif:['Fraunces,Georgia,serif','Inter,system-ui,sans-serif',0]};
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)};
const ratio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const onCol=h=>ratio(h,"#ffffff")>=ratio(h,"#111111")?"#ffffff":"#111111";
function applyCfg(){
  const v=$("#vp"),brand=CFG.layout=="brand",d=+CFG.dark;
  const bg=d?"#0e0f12":brand?"#ffffff":"#f5f5f7",fg=d?"#f3f4f6":"#17181c",cardC=d?"#191b21":"#ffffff";
  const notes=[];let btn=CFG.btn,sale=CFG.sale;
  if(ratio(btn,bg)<1.6){btn=d?"#ffffff":"#111111";notes.push("Ang kulay ng button ay halos kapareho ng background, kaya ginawa itong "+(d?"puti":"itim")+" para makita.")}
  if(ratio(sale,bg)<3){sale=d?"#fb7185":"#dc2626";notes.push("Ang kulay ng Sale ay mahirap basahin sa background na ito, kaya pinalitan ng mas malinaw.")}
  const top=ratio(CFG.top1,"#ffffff")>=ratio(CFG.top1,"#111111")&&ratio(CFG.top2,"#ffffff")>=2.2?"#ffffff":onCol(CFG.top1);
  v.className="vp l-"+CFG.layout+(+CFG.sharp?" sharp":"")+(FONTS[CFG.font][2]?" caps":"");
  const set=(k,x)=>v.style.setProperty(k,x);
  set("--s-bg",bg);set("--s-fg",fg);set("--s-card",cardC);set("--s-mut",d?"#9a9eaa":"#6c7080");set("--s-line",d?"#2a2d36":"#e6e7ec");
  set("--s-acc",btn);set("--s-on",onCol(btn));set("--s-acc2",`color-mix(in srgb, ${btn} 10%, ${bg})`);set("--s-ok",d?"#5fe08a":"#16a34a");
  set("--s-sale",sale);set("--top1",CFG.top1);set("--top2",CFG.top2);set("--on-top",top);
  set("--s-hero",`linear-gradient(120deg, ${CFG.top1}, ${CFG.top2})`);
  set("--s-head",FONTS[CFG.font][0]);set("--s-font",FONTS[CFG.font][1]);set("--s-r",+CFG.sharp?"0px":"14px");
  document.querySelectorAll(".cz .seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(CFG[sg.dataset.k])==b.dataset.v)));
  document.querySelectorAll(".cz [data-c]").forEach(i=>i.value=CFG[i.dataset.c]);
  const n=$("#czn");n.hidden=!notes.length;n.textContent=notes.length?"🛡 Bantay sa contrast: "+notes.join(" "):"";
  render(true);
}
$("#pre").innerHTML=PRESETS.map((p,i)=>`<button data-p="${i}"><i style="background:linear-gradient(120deg,${p[1].top1},${p[1].top2})"></i>${p[0]}</button>`).join("");
$("#cz").addEventListener("click",e=>{const p=e.target.closest("[data-p]"),b=e.target.closest(".seg button");
  if(p){Object.assign(CFG,PRESETS[p.dataset.p][1]);applyCfg()}else if(b){const k=b.parentNode.dataset.k;CFG[k]=["dark","sharp"].includes(k)?+b.dataset.v:b.dataset.v;applyCfg()}});
$("#cz").addEventListener("input",e=>{const c=e.target.dataset.c;if(c){CFG[c]=e.target.value;applyCfg()}});

const _card=card;
card=function(p,o={}){ if(CFG.layout!="brand")return _card(p,o);
  const st=stock(p),off=p.was?Math.round((1-p.p/p.was)*100):0;
  const tag=st==0?"Sold out":off?off+"% Off":st<=2?st+" left":p.nw?"New":"";
  return `<div class="card ${st?"":"sold"}" data-act="open" data-id="${p.id}"><div class="ph">
   <button class="hrt ${S.wish.has(p.id)?"on":""}" data-act="wish" data-id="${p.id}" aria-label="Save">${ic("heart")}</button>
   <div class="imgs">${art(p,0)}${art(p,1)}${art(p,2)}</div>${tag?`<span class="off2">${tag}</span>`:""}
   ${st?`<div class="qs">${Object.entries(p.sizes).map(([s,n])=>`<button data-act="qsize" data-id="${p.id}" data-s="${s}" ${n?"":"disabled"}>${s}</button>`).join("")}</div><button class="qplus" data-act="qsheet" data-id="${p.id}" aria-label="Add to bag">+</button>`:""}</div>
   <div class="inf">${p.cols.length>1?`<div class="sw2">${p.cols.map(c=>`<i style="background:${c[1]}"></i>`).join("")}</div>`:""}
   <div class="t2"><span class="nm">${p.n}</span>${p.sold?`<span class="rt">${p.sold} sold</span>`:""}</div>
   <div class="vr">${p.cols[0][0]} · ${p.cond.split(" — ")[0]}</div>
   <div class="pr"><b>${fmt(p.p)}</b>${p.was?`<s>${fmt(p.was)}</s>`:""}</div></div></div>`};
const row=(title,items,id,cat)=>`<div class="sec"><div class="sech"><h3>${title}</h3><span style="display:flex;align-items:center;gap:6px"><button class="va" data-act="cat" data-c="${cat||"all"}">View all</button><span class="arrows"><button data-act="arr" data-t="${id}" data-d="-1" aria-label="Back">‹</button><button data-act="arr" data-t="${id}" data-d="1" aria-label="Next">›</button></span></span></div><div class="hs" id="${id}">${items.map(p=>card(p)).join("")}</div></div>`;
const _home=home;
VIEWS.home=function(){ if(CFG.layout!="brand")return _home();
  const best=[...P].sort((a,b)=>b.sold-a.sold).slice(0,8),sale=P.filter(p=>p.was),nw=P.filter(p=>p.nw).concat(P.filter(p=>!p.nw)).slice(0,8);
  const from=c=>Math.min(...P.filter(p=>p.cat==c).map(p=>p.p));
  const tile=(c,g,col,label)=>`<button class="tile" data-act="cat" data-c="${c}">${art({g,bg:"#22242b"},0,col)}<span>${label}</span></button>`;
  return header()+`<div class="band"><div class="wrap"><h2>Friday Drop<br>60 new pieces</h2><p>Hand-picked from Japan & Korea. One of each — when it's gone, it's gone.</p>
   <div class="tiles2">${tile("tops","tee","#c7d2fe","Tops")}${tile("jackets","jacket","#fde68a","Jackets")}</div></div></div>
  <div class="wrap"><div class="tline"><span>🚚 7-11 & FamilyMart pickup</span><span>💵 Pay at pickup OK</span><span>✓ 632 orders done</span><span>⚡ Replies in minutes</span></div>
  ${row("Best sellers",best,"r1")}${row("On sale",sale,"r2")}
  <div class="sec"><div class="sech"><h3>Shop by category</h3></div><div class="ptiles">${[["tops","tee","#e9d5ff","#7c3aed","Tops"],["hoodies","hoodie","#fde68a","#b45309","Hoodies"],["bottoms","jeans","#c7d2fe","#3730a3","Bottoms"],["acc","bag","#fed7aa","#9a3412","Bags & Caps"]].map(c=>`<button class="pt" data-act="cat" data-c="${c[0]}">${art({g:c[1],bg:c[2]},0,c[3])}${c[4]} from ${fmt(from(c[0]))}</button>`).join("")}</div></div>
  <div class="sec"><div class="live"><div class="tx"><span class="pill">● LIVE</span><b>Next live: Friday 8:00 PM</b><span>Watch the drop on TikTok & Facebook, or shop it here after.</span></div><button class="btn" data-act="toast" data-m="Opens the seller's live page">Follow the live</button></div></div>
  ${row("New arrivals",nw,"r3")}
  <div class="sec"><div class="about"><h3 style="font-size:19px">About Budgetukay</h3><p>We started live-selling ukay in Taiwan 8 years ago. Every Friday we open new bales live — the best pieces land here. Washed, measured, honestly graded.</p><div class="stats"><div><b>632</b><span>Orders done</span></div><div><b>12</b><span>Products</span></div><div><b>966</b><span>Items sold</span></div></div></div></div>
  <div class="sec"><div class="sech"><h3>How to order</h3></div><div class="steps">
   <div class="step"><i>1</i><span><b>Add to bag</b><span>Pick your size and color. No account needed.</span></span></div>
   <div class="step"><i>2</i><span><b>Choose delivery & payment</b><span>7-11, FamilyMart or home. Pay by transfer, QR or at pickup.</span></span></div>
   <div class="step"><i>3</i><span><b>Track your order</b><span>You get a link to follow your parcel.</span></span></div></div></div>
  <div class="sec"><div class="sech"><h3>Good to know</h3></div>
   <details><summary>How long is shipping?</summary><p>Orders are packed within 1–2 days. Store pickup arrives in 2–3 days.</p></details>
   <details><summary>Can I return or exchange?</summary><p>Yes, within 7 days if the item is not as described.</p></details></div></div>`+footer()};
const _sheet=sheet;
sheet=function(){
  if(S.sheet=="drawer"){const s=sub();return `<div class="drawer" data-act="close"><div data-stop><h3>Your bag (${count()})<button data-act="close" aria-label="Close">×</button></h3>
   ${S.cart.length?S.cart.map((c,i)=>{const p=P.find(x=>x.id==c.id);return `<div class="ci">${art(p,0,p.cols[c.col][1])}<div class="m"><b>${p.n}</b><small>${p.cols[c.col][0]} · ${c.size}</small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="qty"><button data-act="cq" data-i="${i}" data-d="-1">−</button><span>${c.q}</span><button data-act="cq" data-i="${i}" data-d="1">+</button></div><b>${fmt(p.p*c.q)}</b></div><button class="x" data-act="rm" data-i="${i}">Remove</button></div></div>`}).join("")
    +`<div class="note">${s>=FREE?"🎉 You unlocked free shipping":"Add "+fmt(FREE-s)+" more for free shipping"}<div class="prog"><i style="width:${Math.min(100,s/FREE*100)}%"></i></div></div>
    <div class="sum"><div class="t"><span>Subtotal</span><span>${fmt(s)}</span></div></div>
    <button class="btn full" data-act="go" data-v="checkout">Checkout</button><button class="btn o full" data-act="close">Keep shopping</button>`
   :`<div class="empty">${art({g:"bag",bg:"var(--s-line)"},0,"#9ca3af")}<b>Your bag is empty</b><br>There are no products in your bag.</div><button class="btn full" data-act="cat" data-c="all">Shop all</button>`}</div></div>`}
  if(S.sheet=="qs"){const p=P.find(x=>x.id==S.qsId);return `<div class="sheet" data-act="close"><div data-stop><h3>${p.n}</h3><p style="margin:0;color:var(--s-mut);font-size:13px">${fmt(p.p)} · Pick your size</p><div class="qsz">${Object.entries(p.sizes).map(([s,n])=>`<button data-act="qsize" data-id="${p.id}" data-s="${s}" ${n?"":"disabled"}>${s}</button>`).join("")}</div><button class="btn o full" data-act="close">Close</button></div></div>`}
  return _sheet()};
const _render=render;
render=function(k){_render(k);const sc=$("#scr"),h=$("#scr .hdr");
  if(CFG.layout=="brand"&&S.view=="home"&&h){$("#vp").style.setProperty("--hh",h.offsetHeight+"px");const f=()=>h.classList.toggle("top",sc.scrollTop<24);sc.onscroll=f;f()}else sc.onscroll=null};
$("#vp").addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const d=el.dataset;let hit=true;
  if(d.act=="arr"){const r=document.getElementById(d.t);r.scrollBy({left:d.d*r.clientWidth*.8,behavior:"smooth"})}
  else if(d.act=="qsheet"){S.qsId=+d.id;S.sheet="qs";render(true)}
  else if(d.act=="qsize"){const p=P.find(x=>x.id==d.id);if(addCart(p,0,d.s,1)){S.sheet="drawer";render(true)}}
  else if(CFG.layout=="brand"&&d.act=="go"&&d.v=="cart"){S.sheet="drawer";render(true)}
  else if(CFG.layout=="brand"&&d.act=="add"&&S.sel.size){const p=P.find(x=>x.id==S.pid);if(addCart(p,S.sel.col,S.sel.size,S.sel.q)){S.sheet="drawer";render(true)}}
  else if(S.sheet=="drawer"&&(d.act=="cq"||d.act=="rm")){if(d.act=="rm")S.cart.splice(d.i,1);else{const c=S.cart[d.i],pp=P.find(x=>x.id==c.id);c.q=Math.max(1,Math.min(pp.sizes[c.size],c.q+ +d.d))}render(true)}
  else hit=false;
  if(hit){e.stopImmediatePropagation();e.preventDefault()}},true);
applyCfg();
</script>
