<!doctype html>
<!-- Seller Website redesign PROPOSAL — a mock of the buyer pages. NOT app code, not linked from the app.
     Open:  mock.html?shop=budgetukay&page=home   (shop: budgetukay | sundayoven | voltline | dewroom;
     page: home | product | cart | checkout | order).  &bare=1 hides the grey switcher bar (used for pictures).
     Product pictures are drawn stand-ins for the seller's own photos. All shops, buyers and numbers are made up. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Seller Website — redesign proposal (mock)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&display=swap" />
<style>
/* ── paper and ink (the shop's own chrome is neutral; the seller's colours are set by JS as --sign, --btn, --sale) ── */
.shop{--paper:#fdfdfc;--ink:#151515;--ink2:#5b5b58;--ink3:#8d8d89;--rule:rgba(21,21,21,.14);--rule2:#151515;--back:#f0efec;--field:#ffffff;
  --ok:#17794a;--wait:#8a5200;--wait-bg:#fbefd9;--r:0px;--r-s:0px;--pad:16px;
  --fb:"Archivo",system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;--fh:var(--fb);--hw:680;--sign-st:112%;--price-st:80%;--price-w:700;
  font-family:var(--fb);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);min-height:100vh;-webkit-text-size-adjust:100%}
.shop.dark{--paper:#111112;--ink:#f1f0ed;--ink2:#aaa9a4;--ink3:#7f7e7a;--rule:rgba(241,240,237,.17);--rule2:#f1f0ed;--back:#1c1c1d;--field:#17171a;--ok:#5fd08f;--wait:#f0b455;--wait-bg:#2c2415}
.shop.round{--r:12px;--r-s:8px}
.shop.f-friendly{--fb:"Figtree",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;--fh:"Bricolage Grotesque",var(--fb);--hw:700;--sign-st:100%;--price-st:100%}
.shop.f-classic{--fh:"Newsreader",Georgia,"Songti TC",serif;--hw:560;--sign-st:100%;--price-st:100%;--price-w:600}
:where(.shop) *{box-sizing:border-box}
:where(.shop) a{color:inherit}
:where(.shop) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.shop ::selection{background:var(--btn);color:var(--on-btn)}
.shop :focus-visible{outline:2px solid var(--acct);outline-offset:2px}
:where(.shop) :is(h1,h2,h3,p,ol,ul,dl,dd){margin:0;padding:0}
:where(.shop) :is(ol,ul){list-style:none}
.ic{flex:none;display:block}
.wrap{width:100%;max-width:1184px;margin:0 auto;padding:0 var(--pad)}
@media (max-width:899px){.shop .wide{display:none!important}}
img{max-width:100%}
.num{font-family:var(--fh);font-stretch:var(--price-st);font-weight:var(--price-w);font-variant-numeric:tabular-nums lining-nums}
.u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ── the sign: the seller's colour, logo and name. Flat colour, no blend. Second colour = the thin stripe. ── */
.sign{background:var(--sign);color:var(--on-sign);position:sticky;top:0;z-index:5}
.sign-note{font-size:12.5px;line-height:1.3;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--on-sign) 22%,transparent)}
.sign-row{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--on-sign);color:var(--sign);font:700 17px/1 var(--fh);border-radius:var(--r-s)}
.sname{font-family:var(--fh);font-weight:760;font-stretch:var(--sign-st);font-size:19px;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ibtn{width:44px;height:44px;flex:none;display:grid;place-items:center;position:relative;margin:0 -6px}
.count{position:absolute;top:5px;right:3px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center;background:var(--on-sign);color:var(--sign);font:700 12px/1 var(--fb);border-radius:9px}
.sfield{height:40px;flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;white-space:nowrap;overflow:hidden;
  background:color-mix(in srgb,var(--on-sign) 11%,transparent);border:1px solid color-mix(in srgb,var(--on-sign) 30%,transparent);border-radius:var(--r-s)}
.sfield span{opacity:.86;overflow:hidden;text-overflow:ellipsis}
.sign-search{padding:0 0 12px}
.sign-nav{display:none}
.stripe{height:3px;background:var(--sign2)}

/* ── type roles ── */
.cover h1{font:var(--hw) 33px/1.05 var(--fh);letter-spacing:-.024em;text-wrap:balance}
.cover p{margin-top:10px;color:var(--ink2);max-width:44ch}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:1.5px solid var(--rule2);padding-top:12px;margin-bottom:14px}
.sec-h h2{font:var(--hw) 20px/1.2 var(--fh);letter-spacing:-.014em}
.sec-h .more{font-size:13.5px;display:flex;align-items:center;gap:12px}
.sec-h .more a{padding:14px 4px;margin:-14px -4px}
.arrows{display:none}
.price{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:18px;line-height:1.1;margin-top:6px}
.price .cur{font-size:.7em;font-weight:600;margin-right:1px;font-stretch:100%}
.price.cut .now{color:var(--sale-t)}
.was{font:400 12.5px/1 var(--fb);color:var(--ink2);text-decoration:line-through}

/* ── buttons ── */
.btn{min-height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:650 15px/1 var(--fb);border-radius:var(--r-s);border:1.5px solid transparent;white-space:nowrap;text-decoration:none}
.shop .btn.main{background:var(--btn);color:var(--on-btn)}
.shop .btn.line{border-color:var(--ink);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px}
.btn.full{width:100%}

/* ── photos: one frame for every product. The seller's photo fills it; nothing sits on it but one tag and the + ── */
.ph{position:relative;background:var(--back);aspect-ratio:4/5;overflow:hidden;border-radius:var(--r)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tagp{position:absolute;left:8px;bottom:8px;background:var(--paper);color:var(--ink);font:600 12px/1 var(--fb);padding:5px 7px;border-radius:calc(var(--r-s)/2)}
.tagp.sale{background:var(--sale);color:var(--on-sale)}
.quick{position:absolute;right:8px;bottom:8px;width:36px;height:36px;display:grid;place-items:center;background:var(--paper);color:var(--ink);border-radius:var(--r-s);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.quick::after{content:"";position:absolute;inset:-6px}
.savep{position:absolute;right:2px;top:2px;width:44px;height:44px;display:grid;place-items:center}
.savep i{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--paper) 86%,transparent);color:var(--ink)}

/* ── home ── */
.cover{padding-top:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{text-decoration:none;display:block}
.tile .cap{display:flex;justify-content:space-between;align-items:center;padding-top:9px;font:620 15px/1.2 var(--fh)}
.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;border-top:1px solid var(--rule);margin-top:22px}
.fact{display:flex;gap:9px;align-items:center;padding:11px 0;font-size:13.5px;line-height:1.25;border-bottom:1px solid var(--rule)}
.fact .ic{color:var(--ink2)}
.row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:0 var(--pad);scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 44%;max-width:230px;scroll-snap-align:start}
.card{min-width:0;display:block;text-decoration:none}
.cap1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;line-height:1;color:var(--ink2);min-height:13px}
.sw{display:flex;gap:4px}
.sw i{width:11px;height:11px;border-radius:50%;border:1px solid var(--rule)}
.cname{font-size:14px;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .card{flex:0 0 38%}
.sale-h{display:flex;align-items:baseline;gap:10px}
.sale-h .ends{font-size:13px;color:var(--ink2)}
.sale-h .ends b{color:var(--sale-t);font-size:15px}
.coupon{border:1.5px dashed var(--rule2);border-radius:var(--r);padding:20px;display:grid;gap:10px;justify-items:start}
.coupon h3{font:var(--hw) 20px/1.2 var(--fh);letter-spacing:-.012em}
.coupon p{color:var(--ink2)}
.cat{text-decoration:none}
.cat b{display:block;font:620 14.5px/1.25 var(--fh);margin-top:8px}
.cat span{font-size:12.5px;color:var(--ink2)}
.live{border-top:1.5px solid var(--rule2);border-bottom:1px solid var(--rule);padding:14px 0 18px;display:grid;gap:12px;justify-items:start}
.live .lab{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
.live .lab i{width:8px;height:8px;border-radius:50%;background:var(--sale)}
.live .when{font:var(--hw) 24px/1.1 var(--fh);letter-spacing:-.015em}
.live .when small{font:400 15px/1.3 var(--fb);letter-spacing:0;color:var(--ink);display:block;margin-top:4px}
.live p{color:var(--ink2);font-size:14px}
.about p{max-width:60ch}
.verified{display:inline-flex;align-items:center;gap:4px;font:500 12.5px/1 var(--fb);color:var(--ok);letter-spacing:0;margin-left:8px;white-space:nowrap}
.lead{margin-top:16px;max-width:420px}
.lead div{display:flex;align-items:baseline;padding:7px 0}
.lead dt{font-size:14px;color:var(--ink2)}
.lead i{flex:1;border-bottom:1px dotted var(--ink3);margin:0 8px;transform:translateY(-3px)}
.lead dd{font-size:17px}
.howto li{display:grid;grid-template-columns:34px 1fr;column-gap:6px;padding:14px 0;border-bottom:1px solid var(--rule)}
.howto li:first-child{padding-top:2px}
.howto .n{font-size:22px;line-height:1;grid-row:span 2}
.howto b{font-weight:620}
.howto span{font-size:13.5px;color:var(--ink2)}
.faq button{width:100%;min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:13px 0;border-bottom:1px solid var(--rule);font-weight:500}
.faq li:first-child button{padding-top:2px}
.foot{margin-top:56px;border-top:1.5px solid var(--rule2);padding:22px 0 30px;font-size:13.5px;display:grid;gap:22px}
.foot .fname{font:760 18px/1.2 var(--fh);font-stretch:var(--sign-st);letter-spacing:-.01em}
.foot .ftag{color:var(--ink2);margin-top:3px}
.soc{display:flex;gap:6px;margin-top:12px}
.soc a{width:44px;height:44px;display:grid;place-items:center;margin-left:-11px}
.bm{display:inline-grid;place-items:center;border-radius:5px;color:#fff;font:700 12px/1 system-ui;flex:none}
.foot h3{font:620 13.5px/1.2 var(--fb);margin-bottom:6px}
.foot li a{display:flex;align-items:center;min-height:44px;color:var(--ink2);text-decoration:none}
.foot .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.foot .plain{color:var(--ink2)}
.foot .legal{color:var(--ink2);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;border-top:1px solid var(--rule);padding-top:14px}
.tab{position:sticky;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tab a{height:58px;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;line-height:1;color:var(--ink2);text-decoration:none;border-top:2px solid transparent;margin-top:-1px}
.tab a.on{color:var(--ink);font-weight:650;border-top-color:var(--acct)}
.shop .fab{position:fixed;right:16px;bottom:74px;z-index:6;width:52px;height:52px;display:grid;place-items:center;background:var(--btn);color:var(--on-btn);border-radius:max(var(--r),4px);box-shadow:0 6px 18px rgba(0,0,0,.2),0 0 0 1px color-mix(in srgb,var(--paper) 40%,transparent)}

/* ── product ── */
.crumb{font-size:12.5px;color:var(--ink2);padding:12px 0}
.gal .big{margin:0 calc(var(--pad)*-1)}
.gal .big .ph{border-radius:0}
.gal .n{position:absolute;right:10px;bottom:10px;background:var(--paper);color:var(--ink);font:500 12px/1 var(--fb);padding:5px 8px;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs .ph{width:56px;aspect-ratio:1;border-radius:var(--r-s)}
.thumbs .on{outline:2px solid var(--ink);outline-offset:-2px}
.pname{font:var(--hw) 25px/1.14 var(--fh);letter-spacing:-.018em;margin-top:18px;text-wrap:balance}
.psold{font-size:13px;color:var(--ink2);margin-top:5px}
.pprice{font-size:32px;margin-top:12px;align-items:center}
.off{background:var(--sale);color:var(--on-sale);font:700 12px/1 var(--fb);padding:4px 6px;border-radius:calc(var(--r-s)/2)}
.flash{display:flex;gap:8px;align-items:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin-top:14px;font-size:13.5px}
.flash .ic{color:var(--sale-t)}
.flash b{font-size:16px;color:var(--sale-t)}
.optl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin:20px 0 8px}
.optl b{font-weight:650}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;min-width:48px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;border:1px solid var(--ink3);border-radius:var(--r-s)}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:650}
.opt.no{color:var(--ink3);border-style:dashed;text-decoration:line-through}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--rule)}
.stock{font-size:13px;color:var(--ink2);margin-top:12px}
.buyrow{display:flex;gap:10px;align-items:center;margin-top:14px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--ink3);border-radius:var(--r-s);height:46px}
.stepper button{width:44px;height:44px;display:grid;place-items:center}
.stepper b{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.plist{border-top:1px solid var(--rule);margin-top:24px}
.plist li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--rule)}
.plist .ic{margin-top:1px}
.plist b{font-weight:620;font-size:14.5px;display:block}
.plist span{font-size:13px;color:var(--ink2)}
.det{margin-top:26px}
.det h2{font:var(--hw) 17px/1.2 var(--fh);margin-bottom:8px}
.det dl div{display:grid;grid-template-columns:104px 1fr;padding:6px 0;font-size:14px}
.det dt{color:var(--ink2)}
.det dd{font-weight:600}
.det p{font-size:14px;color:var(--ink2);margin-top:8px;max-width:60ch}
.bar{position:sticky;bottom:0;z-index:4;background:var(--paper);border-top:1px solid var(--rule);padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;margin-top:36px}
.bar .btn{flex:1}
.bar .sum{flex:none;min-width:104px}
.bar .sum small{display:block;font-size:12px;color:var(--ink2);line-height:1.2}
.bar .sum b{font-size:21px;line-height:1.1;display:block}

/* ── cart, checkout, order: one ruled sheet (like a parcel slip), not a stack of boxes ── */
.trail{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:14px 0 12px}
.trail b{color:var(--ink);font-weight:650}
.trail i{width:22px;height:1px;background:var(--ink3)}
.block{border-top:1.5px solid var(--rule2);padding:14px 0 24px}
.block>h2,.bh h2{font:var(--hw) 17px/1.25 var(--fh);letter-spacing:-.008em}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hint{font-size:12.5px;color:var(--ink2);margin-top:3px}
.free{font-size:14px}
.track3{height:3px;background:var(--rule);margin-top:9px}
.track3 i{display:block;height:100%;background:var(--ok)}
.cline{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--rule)}
.cline .ph{width:72px}
.cline .nm{font-weight:560;line-height:1.3}
.cline .vr{font-size:13px;color:var(--ink2);margin-top:2px}
.cline .ctl{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:13px}
.cline .amt{font-size:17px;white-space:nowrap}
.rows{margin-top:10px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14.5px}
.rows dt{color:var(--ink2)}
.rows dd{text-align:right;font-weight:560}
.rows .tot{border-top:1px solid var(--rule);margin-top:8px;padding-top:12px;align-items:baseline}
.rows .tot dt{color:var(--ink);font:var(--hw) 17px/1.2 var(--fh)}
.rows .tot dd{font-size:24px;line-height:1}
.mini{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.mini .ph{width:44px}
.mini .nm{font-weight:560;font-size:14px;line-height:1.25}
.mini .vr{font-size:12.5px;color:var(--ink2)}
.mini .amt{font-size:15px}
.fld{margin-top:14px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.inp{height:48px;display:flex;align-items:center;padding:0 12px;font-size:16px;background:var(--field);border:1px solid var(--ink3);border-radius:var(--r-s)}
.inp.area{height:88px}
.choices{margin-top:12px}
.choice{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:13px 12px;border:1px solid var(--rule);margin-top:-1px;position:relative}
.choice:first-child{border-radius:var(--r-s) var(--r-s) 0 0}
.choice:last-child{border-radius:0 0 var(--r-s) var(--r-s)}
.choice.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);z-index:1}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink3);margin-top:1px;display:grid;place-items:center}
.choice.on .radio{border-color:var(--ink)}
.choice.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.choice b{font-weight:620;display:block;line-height:1.3}
.choice span{font-size:13px;color:var(--ink2)}
.choice .fee{font-size:16px}
.sub{font-size:13.5px;font-weight:620;margin:18px 0 8px}
.store{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--rule);border-radius:var(--r-s)}
.store b{font-weight:620;display:block}
.store span{font-size:13px;color:var(--ink2)}
.notice{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:13.5px;color:var(--ink2);margin-top:14px}
.notice .ic{margin-top:1px}
.oh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 16px}
.oh h1{font:var(--hw) 26px/1.1 var(--fh);letter-spacing:-.018em}
.state{font:620 12.5px/1 var(--fb);padding:7px 9px;background:var(--wait-bg);color:var(--wait);border-radius:calc(var(--r-s)/2);white-space:nowrap}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:12px;padding-bottom:16px;position:relative;font-size:14.5px;color:var(--ink2)}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:9.5px;top:20px;bottom:-2px;width:1px;background:var(--rule)}
.steps li:last-child::before{display:none}
.steps i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;background:var(--paper);position:relative}
.steps .done{color:var(--ink)}
.steps .done i{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.steps .now{color:var(--ink);font-weight:650}
.steps .now i{border-color:var(--ink)}
.steps .now i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.payh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.payh .amt{font-size:32px;line-height:1}
.acctno{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin-top:8px}
.acctno small{display:block;font-size:13px;color:var(--ink2)}
.acctno b{font-size:23px;line-height:1.2;white-space:nowrap}
.cancel{display:flex;align-items:center;gap:7px;font-size:13.5px;margin:14px 0}
.cancel b{font-size:16px}
.chat4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.chat4 .btn{justify-content:flex-start;padding:0 12px;font-weight:600;min-width:0}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow .inp{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;color:var(--ink2)}

/* ── laptop ── */
@media (min-width:900px){
  .shop{--pad:48px}
  .shop .phone{display:none!important}
  .sign-note{font-size:13px}
  .sign-row{height:64px;gap:18px}
  .sname{font-size:22px;flex:none}
  .logo{width:38px;height:38px}
  .sign-row .sfield{max-width:420px;margin:0 auto 0 18px}
  .ibtn{margin:0}
  .sign-nav{display:flex;gap:26px;align-items:center;height:42px;font-size:13.5px;border-top:1px solid color-mix(in srgb,var(--on-sign) 16%,transparent)}
  .sign-nav a{text-decoration:none;opacity:.9}
  .sign-nav a.on{opacity:1;font-weight:650;text-decoration:underline;text-underline-offset:6px}
  .cover{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:end;padding-top:52px}
  .cover h1{font-size:56px;letter-spacing:-.03em}
  .cover p{font-size:17px;margin-top:16px}
  .tiles{gap:16px;margin-top:0}
  .tile .cap{font-size:17px;padding-top:12px}
  .facts{grid-template-columns:1fr;margin-top:34px}
  .fact{font-size:14.5px;padding:13px 0}
  .sec{margin-top:72px}
  .sec-h h2{font-size:25px}
  .row{gap:16px;margin:0;padding:0;overflow:hidden}
  .row .card{flex:0 0 calc((100% - 64px)/5);max-width:none}
  .arrows{display:flex;gap:6px}
  .arrows button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--ink3);border-radius:var(--r-s)}
  .cname{font-size:15px}
  .price{font-size:20px}
  .coupon{grid-template-columns:1fr auto;align-items:center;padding:28px 32px;column-gap:32px}
  .coupon h3{font-size:25px}.coupon p{grid-column:1}.coupon .btn{grid-row:1/3;grid-column:2}
  .row.catrow .card{flex:0 0 calc((100% - 96px)/7)}
  .live{grid-template-columns:auto 1fr auto;align-items:center;column-gap:40px;padding:22px 0}
  .live .lab{grid-column:1/-1}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:72px}
  .foot{grid-template-columns:1.3fr 2fr 1.4fr;column-gap:56px;margin-top:88px}
  .foot .legal{grid-column:1/-1}
  .shop .fab{bottom:28px;right:28px}
  .pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:64px;align-items:start}
  .gal{display:grid;grid-template-columns:64px 1fr;gap:12px}
  .gal .big{margin:0;order:2}
  .thumbs{flex-direction:column;margin:0;order:1}
  .thumbs .ph{width:64px}
  .pname{font-size:36px;margin-top:0}
  .pprice{font-size:38px}
  .buy2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .bar{display:none}
  .side{display:grid;grid-template-columns:minmax(0,1fr) 388px;gap:72px;align-items:start}
  .side aside{position:sticky;top:160px}
  .trail{padding:20px 0 16px}
  .oh h1{font-size:32px}
  .chat4{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.opt,.choice,.quick,.tab a{transition:background-color .15s ease-out,border-color .15s ease-out,box-shadow .15s ease-out,color .15s ease-out}
  .ph img{transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .card:hover .ph img,.tile:hover .ph img,.cat:hover .ph img{transform:scale(1.03)}
  .btn:active{transform:scale(.98)}
}

#bar a{color:#eee;padding:2px 6px}#bar a.on{background:#eee;color:#111;text-decoration:none}
body{margin:0;background:#fff}
