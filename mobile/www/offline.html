<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#4f46e5" />
<title>SellerFlowLive</title>
<!--
  OFFLINE SCREEN (Fix B). Capacitor loads this LOCAL page (server.errorPath) when the
  main frame cannot load the site — no network, DNS failure, timeout. Fully offline:
  inline styles, inline logo, no requests. Follows the phone language (zh-TW / en / tl),
  retries the site every 5 s or on tap, shows a tip after 3 failed tries. No error codes.
  The retry target is window.SFL_SERVER_URL (injected by the native shims = the
  configured server.url) with the production site as the fallback.
-->
<style>
  :root { --bg: #f5f3ef; --card: #ffffff; --text: #1f1d2b; --muted: #6b6880; --accent: #4f46e5; --accent-text: #ffffff; --border: #e7e4ee; --tip-bg: #fff7e6; --tip-text: #8a5a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15131d; --card: #1f1c2b; --text: #f3f1ff; --muted: #a39fb8; --accent: #6d64f0; --accent-text: #ffffff; --border: #2d2a3d; --tip-bg: #3a2f14; --tip-text: #ffd27a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; padding-top: calc(24px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 22px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .logo { width: 84px; height: 84px; border-radius: 22px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(79,70,229,.35); }
  .logo svg { width: 56px; height: 56px; }
  .brand { margin-top: 12px; font-size: 13px; letter-spacing: .12em; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  h1 { font-size: 22px; margin: 18px 0 8px; font-weight: 800; letter-spacing: -.01em; }
  p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
  .count { margin-top: 14px; font-size: 13.5px; color: var(--muted); min-height: 20px; }
  .btn { display: block; width: 100%; margin-top: 18px; padding: 15px 0; border: none; border-radius: 14px; background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:active { opacity: .85; }
  .tip { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--tip-bg); color: var(--tip-text); font-size: 13.5px; line-height: 1.45; text-align: left; }
  .tip.on { display: block; }
  .link { display: inline-block; margin-top: 18px; color: var(--accent); font-size: 14px; font-weight: 700; text-decoration: none; padding: 10px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" role="main">
    <div class="logo" aria-hidden="true">
      <!-- SFL mark: shopping bag with the S -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 24h28l3 28H15l3-28z" fill="#ffffff" fill-opacity=".18" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 24v-4a8 8 0 0 1 16 0v4" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <path d="M38.5 33.5c-1.2-2.2-3.6-3.2-6.3-3.2-3.4 0-6 1.8-6 4.4 0 2.4 2 3.4 5.6 4.1 3.6.7 6.2 1.7 6.2 4.5 0 2.7-2.6 4.6-6.3 4.6-3 0-5.5-1.3-6.6-3.6" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand">SellerFlowLive</div>
    <h1 id="t"></h1>
    <p id="x"></p>
    <div class="count" id="c"></div>
    <button class="btn" id="b" type="button"></button>
    <div class="tip" id="tip"></div>
    <br />
    <a class="link" id="a" href="https://t.me/SellerFlowLive" target="_blank" rel="noreferrer"></a>
  </div>
</div>
<script>
(function () {
  var S = {
    zh: { t: "無法連線", x: "網路連線不穩定，系統正在自動重新連線。", c: "正在重新連線…（{n} 秒）", b: "重新連線", a: "聯絡 Admin", tip: "還是無法連線？試試切換 WiFi／行動網路。" },
    en: { t: "Unable to connect", x: "Your connection is unstable. We're reconnecting automatically.", c: "Reconnecting in {n}s…", b: "Try again", a: "Contact Admin", tip: "Still can't connect? Try switching between WiFi and mobile data." },
    tl: { t: "Hindi makakonekta", x: "Mahina ang connection. Kusang kumokonekta ulit.", c: "Kumokonekta ulit sa {n}s…", b: "Subukan ulit", a: "I-contact ang Admin", tip: "Ayaw pa rin? Subukang lumipat ng WiFi o mobile data." }
  };
  var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  var L = "en";
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i] || "").toLowerCase();
    if (l.indexOf("zh") === 0) { L = "zh"; break; }
    if (l.indexOf("tl") === 0 || l.indexOf("fil") === 0) { L = "tl"; break; }
    if (l.indexOf("en") === 0) { L = "en"; break; }
  }
  var s = S[L];
  document.documentElement.lang = L === "zh" ? "zh-TW" : L;
  document.getElementById("t").textContent = s.t;
  document.getElementById("x").textContent = s.x;
  document.getElementById("b").textContent = s.b;
  document.getElementById("a").textContent = s.a;
  document.getElementById("tip").textContent = s.tip;

  var PROD = "https://www.sellerflowlive.com/?apk=20260523-dark-mobile";
  // Read at RETRY time (not page load): the native shim injects window.SFL_SERVER_URL, and the
  // injection can land after this script ran. Production URL when it is still missing.
  function retryTarget() {
    return (typeof window.SFL_SERVER_URL === "string" && window.SFL_SERVER_URL) ? window.SFL_SERVER_URL : PROD;
  }

  // Failed tries within the last 2 minutes (this local page reloads on every failure).
  var KEY = "sfl_offline_tries";
  var tries = 0;
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && typeof raw.n === "number" && Date.now() - raw.at < 120000) tries = raw.n;
    tries += 1;
    localStorage.setItem(KEY, JSON.stringify({ n: tries, at: Date.now() }));
  } catch (e) { tries = 1; }
  if (tries >= 3) document.getElementById("tip").className = "tip on";

  var n = 5, timer = null;
  function tick() {
    document.getElementById("c").textContent = s.c.replace("{n}", String(n));
    if (n <= 0) { go(); return; }
    n -= 1;
    timer = setTimeout(tick, 1000);
  }
  function go() {
    if (timer) clearTimeout(timer);
    document.getElementById("c").textContent = s.c.replace("{n}", "0");
    window.location.replace(retryTarget());
  }
  document.getElementById("b").addEventListener("click", go);
  tick();
})();
</script>
</body>
</html>
